<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUT Mail - Đăng nhập</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2>DUT Secure Mail</h2>
            <p>Hệ thống Mail Server Mã hóa AES-256</p>
        </div>

        <div class="auth-tabs">
            <button id="tab-login-btn" class="tab-btn active" onclick="switchTab('login')">
                <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
            </button>
            <button id="tab-register-btn" class="tab-btn" onclick="switchTab('register')">
                <i class="fa-solid fa-user-plus"></i> Đăng ký
            </button>
        </div>

        <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="login-username">Tên đăng nhập (Email)</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="login-username" placeholder="user@pbl4.com" autocomplete="username" required>
                </div>
            </div>
            <div class="input-group">
                <label for="login-password">Mật khẩu</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
            </div>
            <div class="forgot-row">
                <a href="#" class="forgot-link" onclick="showForgotPassword(event)">Quên mật khẩu?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-block">
                Vào Hộp Thư <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
            <div class="input-group">
                <label for="reg-username">Tên đăng nhập mới</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="email" id="reg-username" placeholder="user@pbl4.com" autocomplete="username" required>
                </div>
            </div>
            <div class="input-group">
                <label for="reg-password">Mật khẩu</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-key input-icon"></i>
                    <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password" required>
                </div>
            </div>
            <div class="input-group">
                <label for="reg-confirm">Xác nhận mật khẩu</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-check-double input-icon"></i>
                    <input type="password" id="reg-confirm" placeholder="••••••••" autocomplete="new-password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-success btn-block">
                Tạo Tài Khoản <i class="fa-solid fa-user-check"></i>
            </button>
        </form>

        <form id="forgot-form" class="auth-form hidden" onsubmit="handleResetPassword(event)" autocomplete="off">
            <p class="auth-help">Nhập tên tài khoản, chọn cách xác minh rồi đặt mật khẩu mới.</p>

            <div class="input-group">
                <label for="fp-username">Tên tài khoản</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="email" id="fp-username" placeholder="user@pbl4.com" autocomplete="username" required>
                </div>
            </div>

            <div class="method-switch">
                <button type="button" id="fp-method-otp" class="method-btn active" onclick="selectResetMethod('OTP')">
                    <i class="fa-solid fa-envelope-circle-check"></i> OTP qua email khôi phục
                </button>
                <button type="button" id="fp-method-backup" class="method-btn" onclick="selectResetMethod('BACKUP_CODE')">
                    <i class="fa-solid fa-key"></i> Mã dự phòng
                </button>
            </div>

            <button type="button" id="fp-send-otp" class="btn btn-outline btn-block" onclick="handleSendOtp()">
                <i class="fa-solid fa-paper-plane"></i> Gửi mã OTP
            </button>

            <div class="input-group" style="margin-top: 14px;">
                <label for="fp-code" id="fp-code-label">Mã OTP</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-hashtag input-icon"></i>
                    <input type="text" id="fp-code" inputmode="numeric" autocomplete="one-time-code" maxlength="20" placeholder="Nhập mã" required>
                </div>
            </div>

            <div class="input-group">
                <label for="fp-new-password">Mật khẩu mới</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="fp-new-password" placeholder="8–32 ký tự, có chữ, số, ký tự đặc biệt" autocomplete="new-password" required
                           oninput="updateStrength('fp-new-password','fp-strength-bar','fp-strength-label')">
                </div>
                <div class="strength"><div id="fp-strength-bar" class="strength-bar"></div></div>
                <div id="fp-strength-label" class="strength-label"></div>
            </div>

            <div class="input-group">
                <label for="fp-confirm">Nhập lại mật khẩu mới</label>
                <div class="input-icon-wrapper">
                    <i class="fa-solid fa-check-double input-icon"></i>
                    <input type="password" id="fp-confirm" placeholder="••••••••" autocomplete="new-password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Đặt lại mật khẩu <i class="fa-solid fa-arrow-right"></i>
            </button>
            <div class="forgot-row" style="margin-top: 12px; text-align: center;">
                <a href="#" class="forgot-link" onclick="backToLogin(event)"><i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập</a>
            </div>

            <div id="fp-message" class="inline-msg hidden"></div>
        </form>

        <div id="auth-message" class="alert-message hidden"></div>
    </div>

    <div id="toast-container"></div>

    <script src="js/auth.js"></script>
</body>
</html>
